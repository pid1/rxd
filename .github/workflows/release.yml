---
name: release

# On a tag vX.Y.Z: test, build rxd-X.Y.Z.tar.gz and its .sha256 with
# scripts/release.py (the same script you run locally; the tarball is
# reproducible, so a local build of the tag must match it byte for byte),
# and publish them as the GitHub release vX.Y.Z. The tag must match VERSION
# in rxd/rxd.py.

on: # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version
        run: |
          set -euo pipefail
          v=$(sh scripts/version.sh)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $v in rxd/rxd.py" >&2
            exit 1
          fi
      - name: Build
        run: |
          set -euo pipefail
          python3 scripts/release.py --ref "$GITHUB_SHA" --out dist
          cat dist/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release and its assets, and nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "rxd $v" \
            --notes "rxd $v. Install: unpack rxd-$v.tar.gz and run 'sudo python3 install.py --prefix /usr/local --user NAME' (docs/install.md). SHA-256: $(cut -d' ' -f1 "rxd-$v.tar.gz.sha256")" \
            "rxd-$v.tar.gz" "rxd-$v.tar.gz.sha256"
