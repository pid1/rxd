---
name: test

# python -m unittest on the versions the receiver runs: Debian bookworm's
# Python 3.11 with its numpy 1.24.2 and scipy 1.10.1, pinned here from PyPI.
# Nothing in the tests reaches the network.

on: # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

permissions: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: numpy and scipy as on Debian bookworm
        run: python -m pip install --disable-pip-version-check numpy==1.24.2 scipy==1.10.1
      - name: Tests
        env:
          LANG: C.UTF-8
        run: python -m unittest discover -v tests
      - name: The release tarball builds
        run: python scripts/release.py --out dist && ls -l dist
